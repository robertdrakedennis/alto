[package]
name = "rs910-audio"
version = "0.1.0"
edition = "2021"
publish = false
description = "The client's audio stack: Vorbis decoder, sound files, voices, busses, line mixers, the audio owner and the output Sink."

# Allowed dependencies: tools/refactor/layers.txt `[crates]`/`[externals]`
# (rs910-core; anyhow, log, cpal). cpal is fenced to this crate. Doc code
# blocks are not compiled, like client910's (`doctest = false`).
[lib]
doctest = false

[dependencies]
rs910-core = { path = "../rs910-core" }
anyhow = "1.0"
log = "0.4"
# Output device sink for the line mixers (audio_sink::DeviceSink).
cpal = "0.16"

[features]
# Every workspace crate has `no-pack` (CI has no server/data/pack). The
# pack-reading audio tests stay in client910 (src/audio_goldens.rs).
no-pack = ["rs910-core/no-pack"]
# Test hooks other crates' tests use (`RecordingSink`, `Output::Lines`,
# `SoundBackend::step_*`, `AudioApi::backend`/`sound_state`/
# `active_sounds`): `#[cfg(any(test, feature = "test-hooks"))]`. client910
# enables it through its [dev-dependencies] only.
test-hooks = []

[lints]
workspace = true
