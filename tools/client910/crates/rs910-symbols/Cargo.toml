[package]
name = "rs910-symbols"
version = "0.1.0"
edition = "2021"
publish = false
description = "The content-symbol registry's Rust bindings: id newtypes and named constants, generated by `sym gen` (docs/symbols.md)."

# Generated sources (src/ is written by `npm --prefix server run sym -- gen`;
# this manifest is hand-written). No dependencies, ever.
[lib]
doctest = false

[features]
# Every workspace crate has `no-pack` (tools/README.md); this one reads no pack.
no-pack = []

[lints]
workspace = true
